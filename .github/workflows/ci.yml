name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run pytest
        run: pytest -v

      - name: Run smoke checks on Python scripts
        run: |
          set -e
          python shipping-projects/container-demurrage-tracker/demurrage_tracker.py
          python shipping-projects/voyage-tce-eu-ets-simulator/tce_eu_ets_simulator.py
          python elements-of-ai/building-ai/ch01-optimization/ex01_pineapple_routes.py
          python elements-of-ai/building-ai/ch01-optimization/ex02_pineapple_emissions.py
